<?xml version="1.0" encoding="UTF-8"?>
<!--
  @dennisl0731/oh-my-ui — vanilla SVG icon sprite for non-React consumers.

  Reference any icon via:
    <svg class="icon" aria-hidden="true"><use href="/path/to/icons.svg#i-NAME"/></svg>

  Same-document references (after inlining this file's contents into the page)
  use just <use href="#i-NAME"/>. Browsers happily resolve same-origin sprite
  references; if you embed cross-origin you'll need CORS headers on the SVG.

  Icons are stroke-based with currentColor — they inherit the surrounding
  text color. Sized 24×24 viewBox; consumers set width/height via CSS:
    .icon { width: 1em; height: 1em; vertical-align: -0.15em; }

  Paths copied from lucide.dev (MIT-licensed).
-->
