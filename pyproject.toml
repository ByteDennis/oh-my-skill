[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oh-my-skill"
version = "0.1.0"
description = "Claude-powered skill cards manager — markdown skill cards with AI extract, per-card chat editing, and GitHub sync."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Dennis", email = "dennisl@udel.edu" },
]
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
]
keywords = ["skill-cards", "claude", "markdown", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
prod = ["gunicorn>=23"]
dev = ["pytest>=7", "pytest-asyncio"]

[project.scripts]
oh-my-skill = "oh_my_skill.cli:main"
oms = "oh_my_skill.oms:main"

[project.urls]
Homepage = "https://github.com/ByteDennis/oh-my-skill"
Repository = "https://github.com/ByteDennis/oh-my-skill"

# ─── hatchling wheel ───
# `packages = ["oh_my_skill"]` already bundles ALL files under the package —
# templates/, static/ (incl. skill.css, icons.svg), themes_data/, cli_helpers/.
# Do NOT add a force-include for those same dirs: it re-adds each file at the
# identical archive path, which newer hatchling rejects with
# "A second file is being added to the wheel archive at the same path".
[tool.hatch.build.targets.wheel]
packages = ["oh_my_skill"]

[tool.hatch.build.targets.sdist]
include = [
  "oh_my_skill/",
  "tests/",
  "README.md",
  "pyproject.toml",
  "Dockerfile",
]
